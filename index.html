<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>PRO!NUNCIA LIKE A PRO!</title>

<link href="https://fonts.googleapis.com/css?family=Special+Elite&display=swap" rel="stylesheet" />

<style>

:root {
    --bg-english: #111;
    --text-english: #ffffff;
    --accent-english: #F8AC10;

    --bg-spanish: #F8AC10;
    --text-spanish: #000000;
    --accent-spanish: #D9171A;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    text-align: center;
    font-family: 'Special Elite', monospace;
    transition: 0.4s ease;
}

body.english {
    background-color: var(--bg-english);
    color: var(--text-english);
}

body.spanish {
    background-color: var(--bg-spanish);
    color: var(--text-spanish);
}

h1 {
    margin: 10px 0 30px 0;
    font-size: clamp(2rem, 5vw, 2.8rem);
}

.language-switcher {
    display: flex;
    gap: 10px;
    margin-bottom: 30px;
}

.main-lang-btn {
    min-width: 140px;
    height: 55px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 1.1rem;
    background: #000;
    color: #fff;
    box-shadow: 0 4px 0 rgba(0,0,0,0.25);
}

.main-lang-btn:active {
    transform: translateY(2px);
}

.flashcard {
    margin-bottom: 30px;
}

#currentWord {
    font-size: clamp(3rem, 10vw, 8rem);
}

#phoneticTranscription {
    font-size: clamp(2rem, 6vw, 5rem);
    color: #F8AC10;
}

.control-btn {
    height: 60px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 1.2rem;
    box-shadow: 0 4px 0 rgba(0,0,0,0.25);
}

.control-btn:active {
    transform: translateY(2px);
}

#playAudioButton {
    width: 100%;
    margin-bottom: 15px;
    background: #D9171A;
    color: #fff;
}

.nav {
    display: flex;
    gap: 15px;
    width: 100%;
}

.nav button {
    width: 48%;
}

</style>

</head>

<body class="english">

<h1>PRO!NUNCIA</h1>

<div class="language-switcher">

    <button id="englishSectionButton" class="main-lang-btn">English 🇺🇸🇬🇧</button>
    <button id="spanishSectionButton" class="main-lang-btn">Español 🇪🇸🇲🇽</button>

</div>

<div class="flashcard">

    <div id="currentWord">Loading...</div>
    <div id="phoneticTranscription"></div>
    <div id="contextInfo"></div>

</div>

<button id="playAudioButton" class="control-btn">PLAY AUDIO 🎧</button>

<div class="nav">
    <button id="prevButton" class="control-btn">Prev</button>
    <button id="nextButton" class="control-btn">Next</button>
</div>

<script>

let DATA = [];
let currentIndex = 0;
let currentLanguage = "EN";
let selectedDialect = "1";

const wordEl = document.getElementById("currentWord");
const ipaEl = document.getElementById("phoneticTranscription");
const ctxEl = document.getElementById("contextInfo");

function filtered() {
    return DATA.filter(x => x.lang === currentLanguage);
}

function render() {

    const list = filtered();
    const item = list[currentIndex];

    if (!item) return;

    wordEl.textContent = item.word;

    ipaEl.textContent =
        selectedDialect === "2"
            ? item.ipa_uk
            : item.ipa_us;

    ctxEl.textContent =
        currentLanguage + " | " +
        (selectedDialect === "1" ? "US" : "UK");
}

function play() {

    const list = filtered();
    const item = list[currentIndex];

    if (!item) return;

    const file =
        selectedDialect === "2"
            ? item.audio_uk
            : item.audio_us;

    new Audio(file).play();
}

function next() {
    const list = filtered();
    currentIndex = (currentIndex + 1) % list.length;
    render();
}

function prev() {
    const list = filtered();
    currentIndex = (currentIndex - 1 + list.length) % list.length;
    render();
}

function setLang(l) {
    currentLanguage = l;
    currentIndex = 0;
    document.body.className = l === "EN" ? "english" : "spanish";
    render();
}

document.getElementById("nextButton").onclick = next;
document.getElementById("prevButton").onclick = prev;
document.getElementById("playAudioButton").onclick = play;

document.getElementById("englishSectionButton").onclick =
    () => setLang("EN");

document.getElementById("spanishSectionButton").onclick =
    () => setLang("ES");

document.querySelectorAll("[data-dialect]").forEach(b => {
    b.onclick = () => {
        selectedDialect = b.dataset.dialect;
        render();
    };
});

fetch("words.json")
    .then(r => r.json())
    .then(d => {
        DATA = d;
        render();
    })
    .catch(e => console.error(e));

</script>

</body>
</html>
