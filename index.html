<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>PRO!NUNCIA LIKE A PRO!</title>

<link href="https://fonts.googleapis.com/css?family=Special+Elite&display=swap" rel="stylesheet" />

<style>

/* ===== YOUR ORIGINAL CSS (UNCHANGED) ===== */

:root {
    --bg-english: #111;
    --text-english: #ffffff;
    --accent-english: #F8AC10;
    --bg-spanish: #F8AC10;
    --text-spanish: #000000;
    --accent-spanish: #D9171A;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    text-align: center;
    font-family: 'Special Elite', monospace;
    background-color: var(--bg-english);
    color: var(--text-english);
    transition: background-color 0.4s ease, color 0.4s ease;
}

body.english { background-color: var(--bg-english); color: var(--text-english); }
body.spanish { background-color: var(--bg-spanish); color: var(--text-spanish); }

h1 {
    margin: 10px 0 30px 0;
    font-size: clamp(2rem, 5vw, 2.8rem);
    line-height: 1.1;
    color: inherit;
    font-family: 'Special Elite', monospace;
}

h1 span {
    display: block;
    margin-top: 5px;
    font-size: 0.9em;
    opacity: 0.9;
}

.language-switcher {
    position: relative;
    z-index: 100;
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 30px;
}

.lang-group { position: relative; }

.main-lang-btn {
    min-width: 140px;
    height: 55px;
    padding: 10px 15px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Special Elite', monospace;
    font-size: 1.1rem;
    background-color: #000;
    color: #fff;
    box-shadow: 0 4px 0 rgba(0,0,0,0.25);
    transition: all 0.2s ease;
}

.main-lang-btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.25);
}

#englishSectionButton.active,
#englishSectionButton:hover {
    background-color: #ffffff;
    color: #000000;
}

#spanishSectionButton {
    background-color: var(--accent-english);
    color: #000000;
}

#spanishSectionButton.active,
#spanishSectionButton:hover {
    background-color: var(--accent-spanish);
    color: #ffffff;
}

.dialect-menu {
    position: absolute;
    top: 110%;
    left: 0;
    width: 100%;
    display: none;
    flex-direction: column;
    overflow: hidden;
    background-color: #ffffff;
    border: 2px solid #000000;
    border-radius: 8px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    z-index: 101;
}

.dialect-menu.show { display: flex; }

.dialect-menu button {
    width: 100%;
    padding: 12px;
    border: none;
    border-bottom: 1px solid #eee;
    cursor: pointer;
    background-color: #fff;
    color: #000;
    font-family: 'Special Elite', monospace;
    font-size: 1rem;
}

.flashcard {
    width: 100%;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-bottom: 30px;
}

#currentWord {
    font-size: clamp(3.5rem, 15vw, 10rem);
    transition: opacity 0.15s ease;
}

#phoneticTranscription {
    font-size: clamp(3rem, 10vw, 7rem);
    color: #F8AC10;
}

.button-group {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
}

.control-btn {
    height: 60px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Special Elite', monospace;
}

#playAudioButton {
    margin-bottom: 15px;
    background-color: var(--accent-spanish);
    color: #fff;
    font-size: 1.4rem;
}

.navigation-row {
    display: flex;
    justify-content: space-between;
    gap: 15px;
}

.nav-btn {
    width: 48%;
}

</style>

</head>

<body class="english">

<h1>PRO!NUNCIA<br><span>LIKE A PRO!</span></h1>

<div class="flashcard">

    <div id="currentWord">Loading...</div>
    <div id="phoneticTranscription"></div>
    <div id="contextInfo"></div>

</div>

<div class="button-group">

    <button id="playAudioButton" class="control-btn">
        PLAY AUDIO 🎧
    </button>

    <div class="navigation-row">

        <button id="prevButton" class="control-btn nav-btn">- Previous</button>
        <button id="nextButton" class="control-btn nav-btn">Next -</button>

    </div>

</div>

<script>

let WORDS = [];
let currentIndex = 0;
let currentDialect = "uk"; // uk / us

const elements = {
    word: document.getElementById("currentWord"),
    phonetic: document.getElementById("phoneticTranscription"),
    btnPlay: document.getElementById("playAudioButton"),
    btnNext: document.getElementById("nextButton"),
    btnPrev: document.getElementById("prevButton"),
    context: document.getElementById("contextInfo")
};

async function loadDataset() {

    const res = await fetch("dataset/metadata/words.csv");
    const text = await res.text();

    const rows = text.trim().split("\n").slice(1);

    WORDS = rows.map(r => {

        const [id, word, uk_audio, us_audio] = r.split(",");

        return { id, word, uk_audio, us_audio };
    });

    displayWord();
}

function displayWord() {

    if (!WORDS.length) return;

    const w = WORDS[currentIndex];

    elements.word.textContent = w.word;
    elements.phonetic.textContent = currentDialect.toUpperCase();

    elements.context.textContent =
        currentDialect === "uk" ? "UK accent" : "US accent";
}

function playAudio() {

    const w = WORDS[currentIndex];

    const path =
        currentDialect === "uk"
            ? w.uk_audio
            : w.us_audio;

    const audio = new Audio(path);
    audio.play();
}

function nextWord() {

    currentIndex = (currentIndex + 1) % WORDS.length;
    displayWord();
}

function prevWord() {

    currentIndex =
        (currentIndex - 1 + WORDS.length) % WORDS.length;

    displayWord();
}

/* ===== EVENTS ===== */

elements.btnPlay.onclick = playAudio;
elements.btnNext.onclick = nextWord;
elements.btnPrev.onclick = prevWord;

/* keyboard */

document.addEventListener("keydown", e => {

    if (e.key === "ArrowRight") nextWord();
    if (e.key === "ArrowLeft") prevWord();
    if (e.key === " ") playAudio();
});

loadDataset();

</script>

</body>
</html>
