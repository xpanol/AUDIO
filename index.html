<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>PRO!NUNCIA LIKE A PRO!</title>

<link href="https://fonts.googleapis.com/css?family=Special+Elite&display=swap" rel="stylesheet" />

<style>

:root {
    --bg-english: #111;
    --text-english: #ffffff;

    --accent-english: #F8AC10;

    --bg-spanish: #F8AC10;
    --text-spanish: #000000;

    --accent-spanish: #D9171A;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;

    min-height: 100vh;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    overflow-x: hidden;

    text-align: center;

    font-family: 'Special Elite', monospace;

    background-color: var(--bg-english);
    color: var(--text-english);

    transition:
        background-color 0.4s ease,
        color 0.4s ease;
}

body.english {
    background-color: var(--bg-english);
    color: var(--text-english);
}

body.spanish {
    background-color: var(--bg-spanish);
    color: var(--text-spanish);
}

h1 {
    margin: 10px 0 30px 0;

    font-size: clamp(2rem, 5vw, 2.8rem);
    line-height: 1.1;

    color: inherit;

    font-family: 'Special Elite', monospace;
}

h1 span {
    display: block;

    margin-top: 5px;

    font-size: 0.9em;
    opacity: 0.9;
}

.language-switcher {
    position: relative;
    z-index: 100;

    display: flex;
    justify-content: center;
    gap: 10px;

    margin-bottom: 30px;
}

.lang-group {
    position: relative;
}

.main-lang-btn {
    min-width: 140px;
    height: 55px;

    padding: 10px 15px;

    border: none;
    border-radius: 8px;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    font-family: 'Special Elite', monospace;
    font-size: 1.1rem;

    background-color: #000;
    color: #fff;

    box-shadow: 0 4px 0 rgba(0,0,0,0.25);

    transition: all 0.2s ease;
}

.main-lang-btn:active {
    transform: translateY(2px);

    box-shadow: 0 2px 0 rgba(0,0,0,0.25);
}

#englishSectionButton.active,
#englishSectionButton:hover {
    background-color: #ffffff;
    color: #000000;
}

#spanishSectionButton {
    background-color: var(--accent-english);
    color: #000000;
}

#spanishSectionButton.active,
#spanishSectionButton:hover {
    background-color: var(--accent-spanish);
    color: #ffffff;
}

.dialect-menu {
    position: absolute;
    top: 110%;
    left: 0;

    width: 100%;

    display: none;
    flex-direction: column;

    overflow: hidden;

    background-color: #ffffff;

    border: 2px solid #000000;
    border-radius: 8px;

    box-shadow: 0 5px 15px rgba(0,0,0,0.3);

    z-index: 101;
}

.dialect-menu.show {
    display: flex;

    animation: fadeIn 0.2s ease;
}

.dialect-menu button {
    width: 100%;

    padding: 12px;

    border: none;
    border-bottom: 1px solid #eeeeee;

    cursor: pointer;

    background-color: #ffffff;
    color: #000000;

    font-family: 'Special Elite', monospace;
    font-size: 1rem;

    transition: background 0.2s ease;
}

.dialect-menu button:hover {
    background-color: #f0f0f0;

    font-weight: bold;
}

.flashcard {
    width: 100%;

    flex-grow: 1;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    margin-bottom: 30px;
}

#currentWord {
    font-family: 'Special Elite', monospace;

    margin: 0 0 10px 0;

    font-size: clamp(3.5rem, 15vw, 10rem);
    line-height: 1.1;

    word-break: break-word;

    transition: opacity 0.15s ease;
}

#phoneticTranscription {
    min-height: 1.2em;

    font-family: 'Special Elite', monospace;

    font-size: clamp(3rem, 10vw, 7rem);
    line-height: 1.1;

    font-weight: normal;

    color: #F8AC10;
}

#contextInfo {
    margin-top: 15px;

    padding: 5px 15px;

    border-radius: 20px;

    font-size: 1.1rem;

    background: rgba(0,0,0,0.1);

    opacity: 0.85;

    font-family: 'Special Elite', monospace;
}

.button-group {
    width: 100%;
    max-width: 400px;

    display: flex;
    flex-direction: column;
    align-items: center;
}

.navigation-row {
    width: 100%;

    display: flex;
    justify-content: space-between;

    gap: 15px;
}

.control-btn {
    height: 60px;

    border: none;
    border-radius: 8px;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    font-family: 'Special Elite', monospace;
    font-size: 1.2rem;

    box-shadow: 0 4px 0 rgba(0,0,0,0.25);

    transition: all 0.2s ease;
}

.control-btn:active {
    transform: translateY(2px);

    box-shadow: 0 2px 0 rgba(0,0,0,0.25);
}

#playAudioButton {
    width: 100%;

    margin-bottom: 15px;

    background-color: var(--accent-spanish);
    color: #ffffff;

    font-size: 1.4rem;
}

#playAudioButton:hover {
    background-color: #ffffff;
    color: #000000;
}

.nav-btn {
    width: 48%;
}

body.english .nav-btn {
    background-color: var(--accent-english);
    color: #000000;
}

body.english .nav-btn:hover {
    background-color: #ffffff;
}

body.spanish .nav-btn {
    background-color: #000000;
    color: #ffffff;
}

body.spanish .nav-btn:hover {
    background-color: #ffffff;
    color: #000000;
}

.spacer {
    height: 10px;

    visibility: hidden;
}

@keyframes fadeIn {

    from {
        opacity: 0;
        transform: translateY(-10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 600px) {

    .language-switcher {
        flex-wrap: wrap;
    }

    .main-lang-btn {
        min-width: 120px;
        height: 50px;

        font-size: 1rem;
    }

    .control-btn {
        height: 50px;

        font-size: 1rem;
    }
}

@media (orientation: landscape) {

    #currentWord {
        font-size: clamp(1.75rem, 7.5vw, 5rem);
    }

    #phoneticTranscription {
        font-size: clamp(1.5rem, 5vw, 3.5rem);
    }
}

</style>
</head>

<body class="english">

<h1>
    PRO!NUNCIA
    <br>
    <span>LIKE A PRO!</span>
</h1>

<div class="language-switcher">

    <div class="lang-group">

        <button id="englishSectionButton" class="main-lang-btn active">
            English 🇺🇸🇬🇧
        </button>

        <div id="englishMenu" class="dialect-menu">
            <button data-dialect="1">🇺🇸 Gen. Am.</button>
            <button data-dialect="2">🇬🇧 UK-RP</button>
        </div>

    </div>

    <div class="lang-group">

        <button id="spanishSectionButton" class="main-lang-btn">
            Español 🇪🇸🇲🇽
        </button>

        <div id="spanishMenu" class="dialect-menu">
            <button data-dialect="1">🇪🇸 Castilian</button>
            <button data-dialect="2">🇲🇽 Lat. Am.</button>
        </div>

    </div>

</div>

<div class="flashcard">

    <div id="currentWord">Loading...</div>

    <div id="phoneticTranscription"></div>

    <div id="contextInfo"></div>

</div>

<div class="button-group">

    <button
        id="playAudioButton"
        class="control-btn"
        title="Press Spacebar"
    >
        PLAY AUDIO 🎧
    </button>

    <div class="navigation-row">

        <button
            id="prevButton"
            class="control-btn nav-btn"
            title="Left Arrow"
        >
            - Previous
        </button>

        <button
            id="nextButton"
            class="control-btn nav-btn"
            title="Right Arrow"
        >
            Next -
        </button>

    </div>

</div>

<script>

const ALL_WORDS_DATA = [

    { word:"approach", lang:"EN", ipa:"əˈproʊtʃ", ipa2:"əˈprəʊtʃ" },
    { word:"budget", lang:"EN", ipa:"ˈbʌdʒɪt", ipa2:"ˈbʌdʒɪt" },
    { word:"call", lang:"EN", ipa:"kɔːl", ipa2:"kɔːl" },
    { word:"change", lang:"EN", ipa:"tʃeɪndʒ", ipa2:"tʃeɪndʒ" },
    { word:"clarify", lang:"EN", ipa:"ˈklærɪfaɪ", ipa2:"ˈklærɪfaɪ" },
    { word:"client", lang:"EN", ipa:"ˈklaɪənt", ipa2:"ˈklaɪənt" },
    { word:"creative", lang:"EN", ipa:"kriˈeɪtɪv", ipa2:"kriˈeɪtɪv" },
    { word:"dashboard", lang:"EN", ipa:"ˈdæʃbɔːrd", ipa2:"ˈdæʃbɔːd" },
    { word:"design", lang:"EN", ipa:"dɪˈzaɪn", ipa2:"dɪˈzaɪn" },
    { word:"digital", lang:"EN", ipa:"ˈdɪdʒɪtəl", ipa2:"ˈdɪdʒɪtəl" },
    { word:"direct", lang:"EN", ipa:"dɪˈrekt", ipa2:"dɪˈrekt" },
    { word:"discount", lang:"EN", ipa:"ˈdɪskaʊnt", ipa2:"ˈdɪskaʊnt" },
    { word:"engagement", lang:"EN", ipa:"ɪnˈɡeɪdʒmənt", ipa2:"ɪnˈɡeɪdʒmənt" },
    { word:"feedback", lang:"EN", ipa:"ˈfiːdbæk", ipa2:"ˈfiːdbæk" },
    { word:"hierarchy", lang:"EN", ipa:"ˈhaɪəˌrɑːrki", ipa2:"ˈhaɪəˌrɑːki" },
    { word:"key", lang:"EN", ipa:"kiː", ipa2:"kiː" },
    { word:"measure", lang:"EN", ipa:"ˈmeʒər", ipa2:"ˈmeʒə" },
    { word:"meeting", lang:"EN", ipa:"ˈmiːtɪŋ", ipa2:"ˈmiːtɪŋ" },
    { word:"networks", lang:"EN", ipa:"ˈnetwɜːrks", ipa2:"ˈnetwɜːks" },
    { word:"objective", lang:"EN", ipa:"əbˈdʒektɪv", ipa2:"əbˈdʒektɪv" },
    { word:"optimize", lang:"EN", ipa:"ˈɑːptɪmaɪz", ipa2:"ˈɒptɪmaɪz" },
    { word:"panel", lang:"EN", ipa:"ˈpænəl", ipa2:"ˈpænəl" },
    { word:"performance", lang:"EN", ipa:"pərˈfɔːrməns", ipa2:"pəˈfɔːməns" },
    { word:"priorities", lang:"EN", ipa:"praɪˈɔːrɪtiz", ipa2:"praɪˈɒrɪtɪz" },
    { word:"process", lang:"EN", ipa:"ˈprɑːses", ipa2:"ˈprəʊses" },
    { word:"progress", lang:"EN", ipa:"ˈprɑːɡres", ipa2:"ˈprəʊɡres" },
    { word:"quarter", lang:"EN", ipa:"ˈkwɔːrtər", ipa2:"ˈkwɔːtə" },
    { word:"reach", lang:"EN", ipa:"riːtʃ", ipa2:"riːtʃ" },
    { word:"report", lang:"EN", ipa:"rɪˈpɔːrt", ipa2:"rɪˈpɔːt" },
    { word:"revenue", lang:"EN", ipa:"ˈrevənuː", ipa2:"ˈrevənjuː" },
    { word:"strategy", lang:"EN", ipa:"ˈstrætədʒi", ipa2:"ˈstrætədʒi" },
    { word:"supervisor", lang:"EN", ipa:"ˈsuːpərvaɪzər", ipa2:"ˈsuːpəvaɪzə" },
    { word:"thoroughly", lang:"EN", ipa:"ˈθʌrəli", ipa2:"ˈθʌrəli" },
    { word:"updating", lang:"EN", ipa:"ʌpˈdeɪtɪŋ", ipa2:"ʌpˈdeɪtɪŋ" }
];

let currentLanguage = "EN";
let filteredWords = [];

let currentIndex = 0;

let selectedDialect = "1";

const elements = {

    word: document.getElementById('currentWord'),

    phonetic: document.getElementById('phoneticTranscription'),

    btnPlay: document.getElementById('playAudioButton'),

    btnNext: document.getElementById('nextButton'),

    btnPrev: document.getElementById('prevButton'),

    btnEng: document.getElementById('englishSectionButton'),

    btnEsp: document.getElementById('spanishSectionButton'),

    context: document.getElementById('contextInfo')

};

const flashcardElement =
    document.querySelector('.flashcard');

function init() {

    updateSection("EN", "1", false);

    setupEventListeners();
}

function updateSection(lang, dialect, shouldScroll = true) {

    currentLanguage = lang;

    selectedDialect = dialect;

    filteredWords =
        ALL_WORDS_DATA.filter(
            word => word.lang === lang
        );

    currentIndex = 0;

    document.body.className =
        lang === "EN"
            ? "english"
            : "spanish";

    elements.btnEng.classList.toggle(
        'active',
        lang === "EN"
    );

    elements.btnEsp.classList.toggle(
        'active',
        lang === "ES"
    );

    closeAllMenus();

    displayWord(currentIndex);

    if (shouldScroll && flashcardElement) {

        flashcardElement.scrollIntoView({

            behavior: 'smooth',

            block: 'start'

        });
    }
}

function displayWord(index) {

    if (!filteredWords.length) return;

    const data = filteredWords[index];

    elements.word.style.opacity = 0;

    setTimeout(() => {

        elements.word.textContent = data.word;

        const showSecondIPA =
            selectedDialect === "2"
            && data.ipa2;

        elements.phonetic.textContent =
            showSecondIPA
                ? data.ipa2
                : data.ipa;

        elements.phonetic.style.color =
            currentLanguage === "EN"
                ? "#F8AC10"
                : "#ffffff";

        elements.word.style.opacity = 1;

        const langName =
            currentLanguage === "EN"
                ? "English"
                : "Español";

        const dialectName =
            currentLanguage === "EN"
                ? (
                    selectedDialect === "1"
                        ? "Gen. Am."
                        : "UK-RP"
                )
                : (
                    selectedDialect === "1"
                        ? "Castilian"
                        : "Lat. Am."
                );

        elements.context.textContent =
            langName + " | " + dialectName;

    }, 150);
}

function playAudio() {

    if (!filteredWords.length) return;

    const data =
        filteredWords[currentIndex];

    const audioPath =
        `audio/${data.word}.mp3`;

    const audio =
        new Audio(audioPath);

    audio.play().catch(error => {

        console.error(
            "Audio error:",
            audioPath,
            error
        );
    });
}

function nextWord() {

    currentIndex =
        (currentIndex + 1)
        % filteredWords.length;

    displayWord(currentIndex);
}

function prevWord() {

    currentIndex =
        (
            currentIndex - 1
            + filteredWords.length
        )
        % filteredWords.length;

    displayWord(currentIndex);
}

function toggleMenu(menuId, event) {

    event.stopPropagation();

    const menu =
        document.getElementById(menuId);

    const isVisible =
        menu.classList.contains('show');

    closeAllMenus();

    if (!isVisible) {

        menu.classList.add('show');
    }
}

function closeAllMenus() {

    document
        .querySelectorAll('.dialect-menu')
        .forEach(menu => {

            menu.classList.remove('show');

        });
}

function setupEventListeners() {

    elements.btnEng.onclick =
        event =>
            toggleMenu(
                'englishMenu',
                event
            );

    elements.btnEsp.onclick =
        event =>
            toggleMenu(
                'spanishMenu',
                event
            );

    elements.btnNext.onclick =
        nextWord;

    elements.btnPrev.onclick =
        prevWord;

    elements.btnPlay.onclick =
        playAudio;

    document
        .querySelectorAll('#englishMenu button')
        .forEach(button => {

            button.onclick = () =>

                updateSection(

                    "EN",

                    button.dataset.dialect,

                    true
                );
        });

    document
        .querySelectorAll('#spanishMenu button')
        .forEach(button => {

            button.onclick = () =>

                updateSection(

                    "ES",

                    button.dataset.dialect,

                    true
                );
        });

    window.onclick =
        closeAllMenus;

    document.addEventListener(
        'keydown',
        event => {

            if (
                event.code === 'Space'
                || event.key === ' '
            ) {

                event.preventDefault();

                playAudio();
            }

            if (event.key === 'ArrowRight') {

                nextWord();
            }

            if (event.key === 'ArrowLeft') {

                prevWord();
            }
        }
    );
}

init();

</script>

</body>
</html>
