<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRO!NUNCIA LIKE A PRO!</title>
    <link href="https://fonts.googleapis.com/css?family=Special+Elite&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg-english: #111;
            --text-english: #ffffff;
            --accent-english: #F8AC10;
            --bg-spanish: #F8AC10;
            --text-spanish: #000000;
            --accent-spanish: #D9171A;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: 'Special Elite', monospace;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        body.english { background-color: var(--bg-english); color: var(--text-english); }
        body.spanish { background-color: var(--bg-spanish); color: var(--text-spanish); }

        h1 {
            margin: 0 0 40px 0;
            font-size: 2.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Styl dla Dropdownu Języków */
        .lang-select-wrapper {
            margin-bottom: 30px;
        }

        #langSelect {
            padding: 12px 25px;
            font-family: 'Special Elite', monospace;
            font-size: 1.3rem;
            background: #000;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 10px;
            cursor: pointer;
            outline: none;
        }

        body.spanish #langSelect {
            background: #fff;
            color: #000;
            border: 2px solid #000;
        }

        /* Styl dla Dialektów (USA/UK) */
        .dialect-switcher {
            display: flex;
            gap: 20px;
            margin-bottom: 60px;
        }

        .dialect-btn {
            min-width: 140px;
            height: 55px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: 1.1rem;
            background: #333;
            color: #fff;
            box-shadow: 0 5px 0 rgba(0,0,0,0.4);
            transition: all 0.2s;
        }

        .dialect-btn.active {
            background: #D9171A;
            color: white;
            transform: scale(1.1);
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
        }

        /* Główne Słowo */
        .flashcard {
            margin-bottom: 60px;
            min-height: 160px;
        }

        #currentWord {
            font-size: clamp(3rem, 12vw, 5.5rem); /* Powiększony font */
            margin: 0;
            text-transform: lowercase;
            letter-spacing: 2px;
        }

        #phoneticTranscription {
            font-size: clamp(1.5rem, 6vw, 3rem);
            color: var(--accent-english);
            margin-top: 20px;
        }

        body.spanish #phoneticTranscription { color: var(--accent-spanish); }

        #contextInfo {
            margin-top: 15px;
            font-size: 1rem;
            text-transform: uppercase;
            opacity: 0.7;
        }

        /* Przyciski Sterowania */
        .control-btn {
            height: 70px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
            font-size: 1.3rem;
            box-shadow: 0 6px 0 rgba(0,0,0,0.4);
            font-weight: bold;
        }

        #playAudioButton {
            width: 100%;
            max-width: 400px;
            margin-bottom: 25px;
            background: #D9171A;
            color: #fff;
        }

        .nav {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 400px;
        }

        .nav button { flex: 1; background: #222; color: white; }
        body.spanish .nav button { background: #fff; color: #000; }

        .dialect-btn:active, .control-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.4);
        }
    </style>
</head>
<body class="english">

    <h1>PRO!NUNCIA</h1>

    <div class="lang-select-wrapper">
        <select id="langSelect">
            <option value="EN">English 🇺🇸🇬🇧</option>
            <option value="ES">Español 🇪🇸🌎</option>
        </select>
    </div>

    <div class="dialect-switcher">
        <button class="dialect-btn active" data-dialect="1" id="dialect1Btn">USA</button>
        <button class="dialect-btn" data-dialect="2" id="dialect2Btn">UK</button>
    </div>

    <div class="flashcard">
        <div id="currentWord">loading...</div>
        <div id="phoneticTranscription"></div>
        <div id="contextInfo"></div>
    </div>

    <button id="playAudioButton" class="control-btn">PLAY AUDIO 🎧</button>

    <div class="nav">
        <button id="prevButton" class="control-btn">PREV</button>
        <button id="nextButton" class="control-btn">NEXT</button>
    </div>

    <script>
        let DATA = [];
        let currentIndex = 0;
        let currentLanguage = "EN";
        let selectedDialect = "1"; 

        const wordEl = document.getElementById("currentWord");
        const ipaEl = document.getElementById("phoneticTranscription");
        const ctxEl = document.getElementById("contextInfo");
        const d1Btn = document.getElementById("dialect1Btn");
        const d2Btn = document.getElementById("dialect2Btn");
        const langSelect = document.getElementById("langSelect");

        function filtered() {
            return DATA.filter(x => x.lang === currentLanguage);
        }

        function render() {
            const list = filtered();
            if (!list || list.length === 0) return;

            const item = list[currentIndex];
            wordEl.textContent = item.word;

            if (currentLanguage === "EN") {
                ipaEl.textContent = selectedDialect === "1" ? (item.ipa_us || "") : (item.ipa_uk || "");
                d1Btn.textContent = "USA 🇺🇸";
                d2Btn.textContent = "UK 🇬🇧";
                ctxEl.textContent = selectedDialect === "1" ? "American" : "British";
            } else {
                ipaEl.textContent = selectedDialect === "1" ? (item.ipa_es || "") : (item.ipa_latam || "");
                d1Btn.textContent = "Spain 🇪🇸";
                d2Btn.textContent = "LATAM 🌎";
                ctxEl.textContent = selectedDialect === "1" ? "Castellano" : "Latino";
            }

            document.querySelectorAll('.dialect-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.dialect === selectedDialect);
            });
        }

        function play() {
            const list = filtered();
            const item = list[currentIndex];
            if (!item) return;

            let rawPath = currentLanguage === "EN" 
                ? (selectedDialect === "1" ? item.audio_us : item.audio_uk)
                : (selectedDialect === "1" ? item.audio_es : item.audio_latam);

            if (rawPath) {
                let cleanPath = rawPath.trim();
                if (!cleanPath.startsWith('dataset/') && !cleanPath.startsWith('./dataset/')) {
                    cleanPath = 'dataset/' + cleanPath;
                }
                if (!cleanPath.startsWith('./')) {
                    cleanPath = './' + cleanPath;
                }
                
                const audio = new Audio(cleanPath);
                audio.play().catch(err => console.error("Audio error:", cleanPath, err));
            }
        }

        // Obsługa zmiany języka w dropdownie
        langSelect.onchange = (e) => {
            currentLanguage = e.target.value;
            currentIndex = 0;
            document.body.className = currentLanguage === "EN" ? "english" : "spanish";
            render();
        };

        document.getElementById("nextButton").onclick = () => {
            const list = filtered();
            if(list.length) {
                currentIndex = (currentIndex + 1) % list.length;
                render();
            }
        };

        document.getElementById("prevButton").onclick = () => {
            const list = filtered();
            if(list.length) {
                currentIndex = (currentIndex - 1 + list.length) % list.length;
                render();
            }
        };

        document.getElementById("playAudioButton").onclick = play;

        document.querySelectorAll(".dialect-btn").forEach(b => {
            b.onclick = () => {
                selectedDialect = b.dataset.dialect;
                render();
            };
        });

        fetch("./words.json?v=" + Date.now())
            .then(r => r.json())
            .then(d => {
                DATA = d;
                render();
            })
            .catch(e => {
                wordEl.textContent = "JSON Load Error";
                console.error(e);
            });
    </script>
</body>
</html>
