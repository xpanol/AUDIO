<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>PRO!NUNCIA LIKE A PRO!</title>

<link href="https://fonts.googleapis.com/css?family=Special+Elite&display=swap" rel="stylesheet" />

<style>

/* ================= ORIGINAL DESIGN (UNCHANGED) ================= */

:root {
    --bg-english: #111;
    --text-english: #ffffff;
    --accent-english: #F8AC10;

    --bg-spanish: #F8AC10;
    --text-spanish: #000000;

    --accent-spanish: #D9171A;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-family: 'Special Elite', monospace;
    background-color: var(--bg-english);
    color: var(--text-english);
}

body.english { background-color: var(--bg-english); color: var(--text-english); }
body.spanish { background-color: var(--bg-spanish); color: var(--text-spanish); }

h1 {
    margin: 10px 0 30px 0;
    font-size: clamp(2rem, 5vw, 2.8rem);
}

/* ================= BUTTONS EXACT AS BEFORE ================= */

.language-switcher {
    display: flex;
    gap: 10px;
    margin-bottom: 30px;
}

.lang-group {
    position: relative;
}

.main-lang-btn {
    min-width: 140px;
    height: 55px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Special Elite', monospace;
    font-size: 1.1rem;
    background: #000;
    color: #fff;
}

.main-lang-btn.active {
    outline: 2px solid #fff;
}

/* ================= DROPDOWN FIXED ================= */

.dialect-menu {
    position: absolute;
    top: 110%;
    left: 0;
    width: 100%;
    display: none;
    flex-direction: column;
    background: #fff;
    border: 2px solid #000;
    z-index: 100;
}

.dialect-menu.show {
    display: flex;
}

.dialect-menu button {
    padding: 10px;
    border: none;
    cursor: pointer;
    background: #fff;
    font-family: inherit;
}

.dialect-menu button:hover {
    background: #eee;
}

/* ================= FLASHCARD ================= */

.flashcard {
    width: 100%;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

#currentWord {
    font-size: clamp(3.5rem, 15vw, 10rem);
}

#phoneticTranscription {
    font-size: clamp(3rem, 10vw, 7rem);
    color: #F8AC10;
}

/* ================= BUTTONS ================= */

.control-btn {
    height: 60px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Special Elite', monospace;
}

#playAudioButton {
    width: 100%;
    margin-bottom: 15px;
    background-color: #D9171A;
    color: #fff;
    font-size: 1.4rem;
}

.navigation-row {
    display: flex;
    gap: 15px;
}

.nav-btn {
    width: 48%;
}

</style>
</head>

<body class="english">

<h1>PRO!NUNCIA<br><span>LIKE A PRO!</span></h1>

<div class="language-switcher">

    <div class="lang-group">

        <button id="englishSectionButton" class="main-lang-btn">English 🇺🇸🇬🇧</button>

        <div id="englishMenu" class="dialect-menu">
            <button data-dialect="UK">🇬🇧 UK</button>
            <button data-dialect="US">🇺🇸 US</button>
        </div>

    </div>

    <div class="lang-group">

        <button id="spanishSectionButton" class="main-lang-btn">Español 🇪🇸🇲🇽</button>

        <div id="spanishMenu" class="dialect-menu">
            <button data-dialect="ES">🇪🇸 Castilian</button>
            <button data-dialect="MX">🇲🇽 LatAm</button>
        </div>

    </div>

</div>

<div class="flashcard">

    <div id="currentWord">Loading...</div>
    <div id="phoneticTranscription"></div>
    <div id="contextInfo"></div>

</div>

<div class="button-group">

    <button id="playAudioButton" class="control-btn">PLAY AUDIO 🎧</button>

    <div class="navigation-row">
        <button id="prevButton" class="control-btn nav-btn">Previous</button>
        <button id="nextButton" class="control-btn nav-btn">Next</button>
    </div>

</div>

<script>

/* ================= STATE ================= */

let WORDS = [];
let currentIndex = 0;

let currentLanguage = "EN";
let currentDialect = "UK";

/* ================= DOM ================= */

const el = {
    word: document.getElementById("currentWord"),
    phonetic: document.getElementById("phoneticTranscription"),
    context: document.getElementById("contextInfo"),
    play: document.getElementById("playAudioButton"),
    next: document.getElementById("nextButton"),
    prev: document.getElementById("prevButton"),

    engBtn: document.getElementById("englishSectionButton"),
    spaBtn: document.getElementById("spanishSectionButton")
};

/* ================= CSV ================= */

async function loadDataset() {

    const res = await fetch("dataset/metadata/words.csv");
    const text = await res.text();

    const lines = text.trim().split("\n");
    const headers = lines[0].split(",");

    WORDS = lines.slice(1).map(line => {
        const values = line.split(",");
        const obj = {};
        headers.forEach((h, i) => obj[h.trim()] = values[i]?.trim());
        return obj;
    });

    render();
}

/* ================= UI ================= */

function render() {

    const w = WORDS[currentIndex];
    if (!w) return;

    el.word.textContent = w.word;

    el.phonetic.textContent =
        currentDialect === "US"
            ? (w.ipa2 || w.ipa)
            : w.ipa;

    el.context.textContent = `${w.lang} | ${currentDialect}`;
}

/* ================= AUDIO ================= */

function playAudio() {

    const w = WORDS[currentIndex];

    const path =
        currentDialect === "US"
            ? w.us_audio
            : w.uk_audio;

    new Audio(path).play();
}

/* ================= NAV ================= */

function next() {
    currentIndex = (currentIndex + 1) % WORDS.length;
    render();
}

function prev() {
    currentIndex = (currentIndex - 1 + WORDS.length) % WORDS.length;
    render();
}

/* ================= DROPDOWNS FIXED ================= */

function toggleMenu(id, e) {

    e.stopPropagation();

    document.querySelectorAll(".dialect-menu")
        .forEach(m => m.classList.remove("show"));

    document.getElementById(id).classList.toggle("show");
}

function closeMenus() {
    document.querySelectorAll(".dialect-menu")
        .forEach(m => m.classList.remove("show"));
}

/* ================= EVENTS ================= */

el.play.onclick = playAudio;
el.next.onclick = next;
el.prev.onclick = prev;

document.getElementById("englishSectionButton")
    .onclick = e => toggleMenu("englishMenu", e);

document.getElementById("spanishSectionButton")
    .onclick = e => toggleMenu("spanishMenu", e);

document.querySelectorAll("[data-dialect]").forEach(btn => {
    btn.onclick = () => {
        currentDialect = btn.dataset.dialect;
        closeMenus();
        render();
    };
});

window.onclick = closeMenus;

document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") next();
    if (e.key === "ArrowLeft") prev();
    if (e.key === " ") playAudio();
});

/* ================= INIT ================= */

loadDataset();

</script>

</body>
</html>
