<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRO!NUNCIA LIKE A PRO!</title>
    <link href="https://fonts.googleapis.com/css?family=Special+Elite&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg-english: #111;
            --text-english: #ffffff;
            --accent-english: #F8AC10;
            --bg-spanish: #F8AC10;
            --text-spanish: #000000;
            --accent-spanish: #D9171A;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: 'Special Elite', monospace;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        body.english { background-color: var(--bg-english); color: var(--text-english); }
        body.spanish { background-color: var(--bg-spanish); color: var(--text-spanish); }

        .title-container {
            margin-bottom: 40px;
            color: #fff;
            text-transform: uppercase;
            line-height: 1.1;
        }
        .title-main { font-size: 3rem; letter-spacing: 5px; display: block; }
        .title-sub { font-size: 1.5rem; letter-spacing: 3px; display: block; opacity: 0.9; }

        .lang-select-wrapper { margin-bottom: 30px; }
        #langSelect {
            padding: 15px 30px;
            font-family: 'Special Elite', monospace;
            font-size: 1.4rem;
            background: #000;
            color: #fff;
            border: 3px solid #fff;
            border-radius: 12px;
            cursor: pointer;
            outline: none;
        }

        .dialect-switcher {
            display: flex;
            gap: 20px;
            margin-bottom: 50px;
        }
        .dialect-btn {
            min-width: 160px;
            height: 60px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: 1.1rem;
            background: #222;
            color: #fff;
            box-shadow: 0 5px 0 rgba(0,0,0,0.5);
            transition: all 0.1s;
            text-transform: uppercase;
        }
        .dialect-btn.active {
            background: #D9171A;
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
        }

        .flashcard { margin-bottom: 50px; min-height: 180px; }
        #currentWord {
            font-size: clamp(3.5rem, 15vw, 6.5rem);
            margin: 0;
            text-transform: lowercase;
            letter-spacing: 2px;
        }
        #phoneticTranscription {
            font-size: clamp(1.8rem, 7vw, 3.5rem);
            color: var(--accent-english);
            margin-top: 20px;
        }
        body.spanish #phoneticTranscription { color: var(--accent-spanish); }
        #contextInfo { margin-top: 15px; font-size: 1.1rem; text-transform: uppercase; opacity: 0.8; }

        .control-btn {
            height: 80px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-family: inherit;
            font-size: 1.4rem;
            box-shadow: 0 6px 0 rgba(0,0,0,0.4);
            font-weight: bold;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-flash { background-color: #fff !important; color: #000 !important; }

        #playAudioButton {
            width: 100%;
            max-width: 450px;
            margin-bottom: 25px;
            background: #D9171A;
            color: #fff;
        }

        .nav {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 450px;
        }
        .nav button { flex: 1; background: #333; color: white; }

        .dialect-btn:active, .control-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.4);
        }
    </style>
</head>
<body class="english">

    <div class="title-container">
        <span class="title-main">PRO!NUNCIA</span>
        <span class="title-sub">LIKE A PRO!</span>
    </div>

    <div class="lang-select-wrapper">
        <select id="langSelect">
            <option value="EN">English 🇺🇸🇬🇧</option>
            <option value="ES">Español 🇪🇸🌎</option>
        </select>
    </div>

    <div class="dialect-switcher">
        <button class="dialect-btn active" data-dialect="1" id="dialect1Btn">USA</button>
        <button class="dialect-btn" data-dialect="2" id="dialect2Btn">UK</button>
    </div>

    <div class="flashcard">
        <div id="currentWord">loading...</div>
        <div id="phoneticTranscription"></div>
        <div id="contextInfo"></div>
    </div>

    <button id="playAudioButton" class="control-btn">PLAY AUDIO 🎧</button>

    <div class="nav">
        <button id="prevButton" class="control-btn">PREV</button>
        <button id="nextButton" class="control-btn">NEXT</button>
    </div>

    <script>
        let DATA = [];
        let currentIndex = 0;
        let currentLanguage = "EN";
        let selectedDialect = "1"; 

        const wordEl = document.getElementById("currentWord");
        const ipaEl = document.getElementById("phoneticTranscription");
        const ctxEl = document.getElementById("contextInfo");
        const d1Btn = document.getElementById("dialect1Btn");
        const d2Btn = document.getElementById("dialect2Btn");
        const langSelect = document.getElementById("langSelect");

        function filtered() {
            return DATA.filter(x => x.lang === currentLanguage);
        }

        function render() {
            const list = filtered();
            
            if (currentLanguage === "EN") {
                d1Btn.textContent = "USA 🇺🇸";
                d2Btn.textContent = "UK 🇬🇧";
            } else {
                d1Btn.textContent = "CASTELLANO 🇪🇸";
                d2Btn.textContent = "LATAM 🌎";
            }

            if (!list || list.length === 0) {
                wordEl.textContent = "no data";
                ipaEl.textContent = "";
                ctxEl.textContent = "";
                return;
            }

            if (currentIndex >= list.length) currentIndex = 0;

            const item = list[currentIndex];
            wordEl.textContent = item.word;

            if (currentLanguage === "EN") {
                ipaEl.textContent = selectedDialect === "1" ? (item.ipa_us || "") : (item.ipa_uk || "");
                ctxEl.textContent = selectedDialect === "1" ? "American" : "British";
            } else {
                ipaEl.textContent = selectedDialect === "1" ? (item.ipa_es || "") : (item.ipa_latam || "");
                ctxEl.textContent = selectedDialect === "1" ? "Castellano" : "Latino";
            }

            document.querySelectorAll('.dialect-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.dialect === selectedDialect);
            });
        }

        function flashButton(btn) {
            btn.classList.add('btn-flash');
            setTimeout(() => btn.classList.remove('btn-flash'), 200);
        }

        function play() {
            const list = filtered();
            const item = list[currentIndex];
            if (!item) return;

            flashButton(document.getElementById("playAudioButton"));

            let rawPath = currentLanguage === "EN" 
                ? (selectedDialect === "1" ? item.audio_us : item.audio_uk)
                : (selectedDialect === "1" ? item.audio_es : item.audio_latam);

            if (rawPath) {
                let cleanPath = rawPath.trim();
                if (!cleanPath.startsWith('dataset/') && !cleanPath.startsWith('./dataset/')) {
                    cleanPath = 'dataset/' + cleanPath;
                }
                if (!cleanPath.startsWith('./')) cleanPath = './' + cleanPath;
                
                const audio = new Audio(cleanPath);
                audio.play().catch(err => console.error("Audio error:", cleanPath, err));
            }
        }

        langSelect.onchange = (e) => {
            currentLanguage = e.target.value;
            currentIndex = 0;
            document.body.className = currentLanguage === "EN" ? "english" : "spanish";
            render();
        };

        document.getElementById("nextButton").onclick = function() {
            flashButton(this);
            const list = filtered();
            if(list.length) {
                currentIndex = (currentIndex + 1) % list.length;
                render();
            }
        };

        document.getElementById("prevButton").onclick = function() {
            flashButton(this);
            const list = filtered();
            if(list.length) {
                currentIndex = (currentIndex - 1 + list.length) % list.length;
                render();
            }
        };

        document.getElementById("playAudioButton").onclick = play;

        document.querySelectorAll(".dialect-btn").forEach(b => {
            b.onclick = () => {
                selectedDialect = b.dataset.dialect;
                render();
            };
        });

        fetch("./words.json?v=" + Date.now())
            .then(r => r.json())
            .then(d => {
                DATA = d;
                render();
            })
            .catch(e => {
                wordEl.textContent = "JSON Load Error";
                console.error(e);
            });
    </script>
</body>
</html>
