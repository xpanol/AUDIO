<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>PRO!NUNCIA LIKE A PRO!</title>

<link href="https://fonts.googleapis.com/css?family=Special+Elite&display=swap" rel="stylesheet"/>

<style>

/* ================= RESET STABLE ================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Special Elite', monospace;
    transition: 0.2s ease;
}

/* ================= THEMES ================= */

body.english {
    background: #111;
    color: #fff;
}

body.spanish {
    background: #F8AC10;
    color: #000;
}

/* ================= TITLE ================= */

h1 {
    font-size: 2.5rem;
    margin-bottom: 25px;
}

/* ================= LANGUAGE BUTTONS (FIXED LOOK) ================= */

.language-switcher {
    display: flex;
    gap: 12px;
    margin-bottom: 30px;
}

.lang-group {
    position: relative;
}

/* EXACT ORIGINAL SIZE STYLE (RESTORED) */
.main-lang-btn {
    min-width: 140px;
    height: 55px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 1.05rem;
    background: #000;
    color: #fff;
    box-shadow: 0 4px 0 rgba(0,0,0,0.25);
}

.main-lang-btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.25);
}

/* ================= FLASHCARD ================= */

#word {
    font-size: 4rem;
    margin-bottom: 10px;
}

#ipa {
    font-size: 2.5rem;
    color: #F8AC10;
    margin-bottom: 10px;
}

/* ================= CONTROL BUTTONS (FIXED) ================= */

.control-btn {
    height: 60px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 1.2rem;
    box-shadow: 0 4px 0 rgba(0,0,0,0.25);
}

.control-btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.25);
}

#play {
    width: 100%;
    margin-bottom: 15px;
    background: #D9171A;
    color: #fff;
}

.nav {
    display: flex;
    gap: 15px;
    width: 100%;
}

.nav button {
    width: 48%;
}

/* ================= ACTIVE FEEDBACK ================= */

.active {
    filter: brightness(1.3);
}

</style>

</head>

<body class="english">

<h1>PRO!NUNCIA</h1>

<div class="language-switcher">

    <button id="enBtn" class="main-lang-btn">English 🇺🇸🇬🇧</button>
    <button id="esBtn" class="main-lang-btn">Español 🇪🇸🇲🇽</button>

</div>

<div id="word">Loading...</div>
<div id="ipa"></div>

<button id="play" class="control-btn">PLAY AUDIO 🎧</button>

<div class="nav">
    <button id="prev" class="control-btn">Prev</button>
    <button id="next" class="control-btn">Next</button>
</div>

<script>

/* ================= SAFE DATA (NO CSV BUGS) ================= */

const DATA = [
    { word: "approach", lang: "EN", ipa: "əˈproʊtʃ", uk: "audio/UK/0001.mp3", us: "audio/US/0001.mp3" },
    { word: "budget", lang: "EN", ipa: "ˈbʌdʒɪt", uk: "audio/UK/0002.mp3", us: "audio/US/0002.mp3" },
    { word: "hola", lang: "ES", ipa: "ˈola", uk: "audio/UK/0003.mp3", us: "audio/US/0003.mp3" }
];

let lang = "EN";
let i = 0;

/* ================= CORE ================= */

function list() {
    return DATA.filter(x => x.lang === lang);
}

function render() {

    const item = list()[i];
    if (!item) return;

    document.getElementById("word").textContent = item.word;
    document.getElementById("ipa").textContent = item.ipa || "";
}

/* ================= AUDIO ================= */

function play() {

    const item = list()[i];
    const file = item.us; // simplified stable version

    if (file) new Audio(file).play();
}

/* ================= NAV ================= */

function next() {
    i = (i + 1) % list().length;
    render();
}

function prev() {
    i = (i - 1 + list().length) % list().length;
    render();
}

/* ================= LANG ================= */

function setLang(l) {
    lang = l;
    i = 0;
    document.body.className = l === "EN" ? "english" : "spanish";
    render();
}

/* ================= EVENTS ================= */

document.getElementById("next").onclick = next;
document.getElementById("prev").onclick = prev;
document.getElementById("play").onclick = play;

document.getElementById("enBtn").onclick = () => setLang("EN");
document.getElementById("esBtn").onclick = () => setLang("ES");

/* ================= INIT ================= */

render();

</script>

</body>
</html>
