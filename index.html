<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>PRO!NUNCIA LIKE A PRO!</title>

<link href="https://fonts.googleapis.com/css?family=Special+Elite&display=swap" rel="stylesheet" />

<style>

/* ================= BRAND ================= */

:root {
    --bg-en: #111;
    --bg-es: #F8AC10;
    --text-en: #fff;
    --text-es: #000;
}

/* ================= BASE ================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: 'Special Elite', monospace;
    transition: 0.25s ease;
}

/* ================= THEMES ================= */

body.english {
    background: var(--bg-en);
    color: var(--text-en);
}

body.spanish {
    background: var(--bg-es);
    color: var(--text-es);
}

/* ================= TITLE ================= */

h1 {
    font-size: clamp(2rem, 5vw, 2.8rem);
    margin-bottom: 30px;
}

/* ================= LANGUAGE BUTTONS ================= */

.language-switcher {
    display: flex;
    gap: 10px;
    margin-bottom: 30px;
}

.lang-group {
    position: relative;
}

.main-lang-btn {
    min-width: 140px;
    height: 55px;
    padding: 10px 15px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Special Elite', monospace;
    font-size: 1.1rem;
    background: #000;
    color: #fff;
    box-shadow: 0 4px 0 rgba(0,0,0,0.25);
}

/* ================= CONTROL BUTTONS ================= */

.control-btn {
    height: 60px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Special Elite', monospace;
    font-size: 1.2rem;
    box-shadow: 0 4px 0 rgba(0,0,0,0.25);
    transition: 0.15s ease;
}

.control-btn:hover {
    transform: translateY(-1px);
}

.control-btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.25);
}

/* NAV */

.nav-btn {
    width: 48%;
}

/* AUDIO */

#playAudioButton {
    width: 100%;
    margin-bottom: 15px;
    background: #D9171A;
    color: #fff;
}

/* ================= FLASHCARD ================= */

#currentWord {
    font-size: clamp(3.5rem, 15vw, 10rem);
}

#phoneticTranscription {
    font-size: clamp(3rem, 10vw, 7rem);
    color: #F8AC10;
}

/* ================= LAYOUT ================= */

.navigation-row {
    display: flex;
    gap: 15px;
}

/* ================= ACTIVE FEEDBACK ================= */

.active-click {
    filter: brightness(1.4);
}

/* ================= DROPDOWN ================= */

.dialect-menu {
    position: absolute;
    top: 110%;
    left: 0;
    width: 100%;
    display: none;
    flex-direction: column;
    background: #fff;
    border: 2px solid #000;
    z-index: 100;
}

.dialect-menu.show {
    display: flex;
}

.dialect-menu button {
    padding: 10px;
    border: none;
    cursor: pointer;
    background: #fff;
    font-family: inherit;
}

</style>
</head>

<body class="english">

<h1>PRO!NUNCIA<br><span>LIKE A PRO!</span></h1>

<div class="language-switcher">

    <div class="lang-group">

        <button id="engBtn" class="main-lang-btn">English 🇺🇸🇬🇧</button>

        <div id="engMenu" class="dialect-menu">
            <button data-dialect="UK">🇬🇧 UK</button>
            <button data-dialect="US">🇺🇸 US</button>
        </div>

    </div>

    <div class="lang-group">

        <button id="esBtn" class="main-lang-btn">Español 🇪🇸🇲🇽</button>

        <div id="esMenu" class="dialect-menu">
            <button data-dialect="ES">🇪🇸 Castilian</button>
            <button data-dialect="MX">🇲🇽 LatAm</button>
        </div>

    </div>

</div>

<div id="currentWord">Loading...</div>
<div id="phoneticTranscription"></div>
<div id="contextInfo"></div>

<button id="playAudioButton" class="control-btn">PLAY AUDIO 🎧</button>

<div class="navigation-row">

    <button id="prevButton" class="control-btn nav-btn">Previous</button>
    <button id="nextButton" class="control-btn nav-btn">Next</button>

</div>

<script>

/* ================= STATE ================= */

let DATA = [];
let index = 0;
let lang = "EN";
let dialect = "UK";

/* ================= LOAD ================= */

async function loadData() {

    const res = await fetch("dataset/metadata/words.csv");
    const text = await res.text();

    const rows = text.trim().split("\n");
    const headers = rows[0].split(",");

    DATA = rows.slice(1).map(r => {
        const v = r.split(",");
        const o = {};
        headers.forEach((h,i)=> o[h.trim()] = v[i]?.trim());
        return o;
    });

    render();
}

/* ================= FILTER ================= */

function filtered() {
    return DATA.filter(w => w.lang === lang);
}

/* ================= RENDER ================= */

function render() {

    const list = filtered();
    const w = list[index];

    if (!w) return;

    document.getElementById("currentWord").textContent = w.word;

    document.getElementById("phoneticTranscription").textContent =
        dialect === "US"
            ? (w.ipa2 || w.ipa || "")
            : (w.ipa || "");

    document.getElementById("contextInfo").textContent =
        `${lang} | ${dialect}`;
}

/* ================= AUDIO ================= */

function playAudio() {

    const w = filtered()[index];

    const file =
        dialect === "US"
            ? w.us_audio
            : w.uk_audio;

    if (!file) return;

    new Audio(file).play();
}

/* ================= NAV ================= */

function next() {
    index = (index + 1) % filtered().length;
    render();
}

function prev() {
    index = (index - 1 + filtered().length) % filtered().length;
    render();
}

/* ================= FEEDBACK ================= */

function flash(btn) {
    btn.classList.add("active-click");
    setTimeout(()=>btn.classList.remove("active-click"),120);
}

/* ================= EVENTS ================= */

document.getElementById("nextButton").onclick = e => {
    flash(e.target);
    next();
};

document.getElementById("prevButton").onclick = e => {
    flash(e.target);
    prev();
};

document.getElementById("playAudioButton").onclick = e => {
    flash(e.target);
    playAudio();
};

/* ================= LANGUAGE ================= */

document.getElementById("engBtn").onclick = e => {
    toggle("engMenu");
    lang = "EN";
    document.body.className = "english";
    index = 0;
    render();
};

document.getElementById("esBtn").onclick = e => {
    toggle("esMenu");
    lang = "ES";
    document.body.className = "spanish";
    index = 0;
    render();
};

/* ================= MENUS ================= */

function toggle(id) {
    document.querySelectorAll(".dialect-menu")
        .forEach(m => m.classList.remove("show"));

    document.getElementById(id).classList.toggle("show");
}

document.querySelectorAll("[data-dialect]").forEach(b => {
    b.onclick = () => {
        dialect = b.dataset.dialect;
        render();
    };
});

window.onclick = () => {
    document.querySelectorAll(".dialect-menu")
        .forEach(m => m.classList.remove("show"));
};

/* ================= INIT ================= */

loadData();

</script>

</body>
</html>
